# gitleaks configuration: all default rules, plus narrowly scoped allowlists for
# reviewed false positives. Each allowlist names the rule, the file, the matched
# text and why. `condition = "AND"` makes an entry apply only when the path and
# the line both match (the default, OR, would allowlist the whole file).
# The `secrets` CI job runs a canary that checks this scoping.

[extend]
useDefault = true

[[allowlists]]
description = "Reviewed schema prose at its current and historical paths; the field list is not a secret"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/plan/schemas\.md$''', '''^docs/roadmap/schemas\.md$''']
regexTarget = "line"
regexes = ['''request ID/idempotency key, parent/previous response ID''']

[[allowlists]]
description = "Reviewed DSH SDK source-file SHA-256; exact artifact path and complete digest line only"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^spikes/dsh-harness/artifacts\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"deepseek_harness/api\.py": "9c772909775196fc4070182191738ad227a3bfdccc68d1b6f4e8b90dec08430b",?\s*$''',
]
