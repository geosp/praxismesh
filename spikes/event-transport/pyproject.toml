[project]
name = "praxismesh-event-transport-spike"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "temporalio==1.36.0",
    "nats-py==2.17.0",
    "asyncpg==0.32.0",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = ["pytest>=9.2,<10", "pytest-asyncio>=1.0,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
