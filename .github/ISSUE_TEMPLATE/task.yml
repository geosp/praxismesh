name: Task
description: Planned work traced to the project plan (a phase task, a bootstrap item, a design or tooling change).
title: "<Phase or area>: <short description>"
body:
  - type: markdown
    attributes:
      value: |
        Trace the work to `PROJECT_PLAN.md`. Material design changes need an RFC or ADR (`docs/templates/`), and requirement changes an implementation plan.
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - Pre-0 (spike and inputs)
        - Bootstrap (section 0)
        - Phase 0
        - Phase 1
        - Phase 2
        - Phase 3A
        - Phase 3B
        - Phase 4
        - Phase 5
        - Phase 6
        - Phase 6B
        - Phase 7
        - Phase 8
        - Phase 9
        - Not phase-specific
    validations:
      required: true
  - type: input
    id: plan-sections
    attributes:
      label: Plan sections
      description: The sections this work implements, for example "§0.1" or "§4.3, §5".
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this delivers and why it is needed now.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable outcomes. For a phase task, include the tests and the demo item it satisfies.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Implementation plan, RFC or ADR links, dependencies, open questions.
