# Weekly online link check over all Markdown, including external URLs.
# Informational only: not a required check, so a slow or down website never
# blocks a merge (plan §0.1 link check; PR CI checks internal links offline).

name: links-weekly

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress --include-fragments --hidden
            --max-retries 3 --accept 200,206,429
            --exclude-path '\.claude/skills' --exclude-path '\.git/' --exclude-path '\.venv'
            './**/*.md'
