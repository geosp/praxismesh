# Project CI (plan §0.1, §8). Runs on every PR and on pushes to main.
# Fork safety: only `pull_request` (never `pull_request_target`), a read-only
# token, and no secrets referenced anywhere in this file.
# Pins: every action by full commit SHA and OpenSpec's whole npm tree through
# .github/tools/package-lock.json, both updated by Dependabot. uv, gitleaks and
# actionlint are pinned below and bumped by hand (Dependabot cannot see them): for
# uv, set UV_VERSION; for the others, set *_VERSION and *_SHA256 from the
# release's checksums file.
# The single required status check on main is `ci-ok`; its rule is in
# .github/scripts/ci_gate.py (tested in tests/test_ci_gate.py).
# Model- and GPU-dependent suites run separately (scheduled / self-hosted, §8).

name: ci

# Retargeting a PR to another base does not re-run CI (`edited` is not a trigger,
# because a skipped run on every title or body edit would replace a green ci-ok).
# After changing a PR's base, close and reopen it to re-run CI against the new base.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run. Runs on main are never cancelled, so
# every commit on main keeps its own ci-ok result.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.5"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum verified)
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$f" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${f}"
          echo "${ACTIONLINT_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" actionlint
      # Uses the runner's shellcheck for the `run:` scripts.
      - run: ./actionlint -no-color

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run mypy

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      # Unit tests, including Workflow replay tests against committed histories
      # (plan §8). Integration tests are excluded here (marker `integration`) and
      # run in the `stack` job; model-dependent suites run in neither.
      - run: uv run pytest

  # The Phase 0 local stack (infra/docker-compose.yml): start it, migrate, run the
  # integration tests and the restart check. infra/.env comes from the committed
  # example; its placeholder passwords are local to the runner, not secrets.
  # VLLM_BASE_URL stays empty, so the model tests skip (the unreachable-endpoint
  # test still runs). If Docker Hub pulls prove flaky, skip these steps (never the
  # job: a skipped job fails ci-ok) on PRs that touch none of the stack paths.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: cp infra/.env.example infra/.env
      - run: make up
      - run: make migrate
      - run: make smoke
      - run: make restart-check
      - name: Stack logs on failure
        if: failure()
        run: make status; docker compose --env-file infra/.env -f infra/docker-compose.yml logs --no-color --tail 200
      - name: Clean up
        if: always()
        run: make reset

  agents-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      # The script's PEP 723 dependencies are locked in .agents/sync_agents.py.lock
      # (tests/test_tool_pins.py keeps its PyYAML equal to uv.lock's).
      - run: uv run --locked .agents/sync_agents.py --check

  openspec:
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install OpenSpec from the lockfile (integrity-checked, no install scripts)
        run: |
          npm ci --prefix .github/tools --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/tools/node_modules/.bin" >> "$GITHUB_PATH"
      - run: openspec --version
      - run: openspec validate --all
      # Generated openspec-* skills must match what this OpenSpec version
      # produces with the project's settings (shared `agents` target, skills only):
      # regenerate them all and fail on any difference. `config set` writes the
      # runner's user config, which is discarded with the runner.
      - name: Generated skills are up to date
        run: |
          openspec config set delivery skills
          openspec update --force
          git diff --stat
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "Generated OpenSpec files differ: run 'openspec update --force' and commit." >&2
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks
      # Canary: the scanner and the allowlist in .gitleaks.toml still behave as
      # intended. A generated fake key must be found in an ordinary file, even on a
      # line with the allowlisted phrase, and suppressed only in docs/plan/schemas.md.
      - name: Canary (gitleaks still catches a key)
        run: |
          canary="$RUNNER_TEMP/gitleaks-canary"
          mkdir -p "$canary/docs/plan" "$canary/other"
          key="$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)"
          # Take the allowlisted phrase from .gitleaks.toml (a plain-text regex).
          # Spelling it out here would itself be flagged, since the allowlist only
          # covers docs/plan/schemas.md.
          phrase="$(sed -n "s/^regexes = \['''\(.*\)'''\]$/\1/p" .gitleaks.toml)"
          [ -n "$phrase" ] || { echo "allowlist regex not found in .gitleaks.toml" >&2; exit 1; }
          line="$phrase api_key = \"${key}\""
          echo "$line" > "$canary/docs/plan/schemas.md"
          echo "$line" > "$canary/other/notes.md"
          cfg="$PWD/.gitleaks.toml"
          (cd "$canary" && "$GITHUB_WORKSPACE/gitleaks" dir --config "$cfg" --redact \
            --report-format json --report-path "$RUNNER_TEMP/canary.json" .) && {
            echo "gitleaks found nothing in the canary" >&2; exit 1; }
          files="$(jq -r '[.[].File] | unique | join(",")' "$RUNNER_TEMP/canary.json")"
          echo "canary findings in: $files"
          if [ "$files" != "other/notes.md" ]; then
            echo "expected findings only in other/notes.md" >&2; exit 1
          fi
      # On main and manual runs the whole history is scanned, so a gitleaks
      # upgrade with a new rule can flag an old commit and turn main red. Fix that
      # with a reviewed allowlist entry in .gitleaks.toml, not by rewriting history.
      - name: Scan commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            ./gitleaks git --config .gitleaks.toml --redact --log-opts="${BASE_SHA}..${HEAD_SHA}" .
          else
            ./gitleaks git --config .gitleaks.toml --redact .
          fi

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Offline: internal links and anchors only, so external sites never block
      # a merge. External URLs are checked weekly (links-weekly.yml).
      # .claude/skills is a symlink to .agents/skills; checking it twice would
      # resolve relative links from the wrong directory.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --offline --no-progress --include-fragments --hidden
            --exclude-path '\.claude/skills' --exclude-path '\.git/' --exclude-path '\.venv'
            './**/*.md'
      # Canary: the same offline check must reject a broken internal link.
      - name: Write canary
        run: |
          mkdir -p "$RUNNER_TEMP/link-canary"
          echo '[broken](./does-not-exist.md)' > "$RUNNER_TEMP/link-canary/canary.md"
      - id: link-canary
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: false
          jobSummary: false
          output: ${{ runner.temp }}/link-canary/report.md
          args: --offline --no-progress '${{ runner.temp }}/link-canary/canary.md'
      - name: Canary (lychee still catches a broken link)
        env:
          CANARY_EXIT: ${{ steps.link-canary.outputs.exit_code }}
        run: |
          echo "lychee canary exit code: $CANARY_EXIT"
          [ "$CANARY_EXIT" = "2" ] || { echo "lychee did not reject the broken link" >&2; exit 1; }

  licenses:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Checks dependencies added or changed by the PR: licenses must be
      # compatible with Apache-2.0, and no high-severity known vulnerabilities.
      # Every entry in uv.lock and .github/tools/package-lock.json reaches main
      # through a PR, so each was scanned when it was added or changed (all of
      # uv.lock in PR #7). The sync script's own lock pins the same PyYAML as
      # uv.lock (tests/test_tool_pins.py). gitleaks and lychee are CI-only
      # binaries that are never shipped, so they are not scanned.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          allow-licenses: >-
            Apache-2.0, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, ISC, PSF-2.0, Python-2.0,
            MPL-2.0, Unlicense, 0BSD, CC0-1.0, Zlib
          # Reviewed false positives: GitHub's license detection disagrees with
          # the package's own metadata. Keep each entry justified here.
          # - typing-extensions: declares License-Expression PSF-2.0; GitHub reads
          #   its bundled Python license history as including GPL-1.0-or-later.
          #   A runtime dependency since Phase 0 (via temporalio and sqlalchemy);
          #   its own metadata declares PSF-2.0, which is on the allow-list.
          # The action matches these entries by type and name only and ignores
          # any @version (src/purl.ts purlsMatch), so each entry covers every
          # version of the package. Re-check the license when it is bumped.
          allow-dependencies-licenses: >-
            pkg:pypi/typing-extensions

  # Every job must succeed; a skipped job fails the gate. The only exception is
  # `licenses` on main itself (see .github/scripts/ci_gate.py and its tests).
  ci-ok:
    if: always()
    needs: [lint, workflows, types, tests, stack, agents-sync, openspec, secrets, links, licenses]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: All required jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: python3 .github/scripts/ci_gate.py
