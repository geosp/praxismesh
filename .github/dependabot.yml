version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
  - package-ecosystem: npm
    directory: /.github/tools
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    # Server and admin tools must move to the same Temporal version together.
    groups:
      temporal:
        patterns: ["temporalio/server", "temporalio/admin-tools"]
    commit-message:
      prefix: deps
