[project]
name = "praxismesh"
version = "0.0.0"
description = "Durable orchestration for autonomous AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.44.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openai-agents>=0.24.0",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "temporalio>=1.36.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".agents/skills", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Pydantic copies field defaults per instance; RUF012 sees our `Strict` base, not BaseModel.
"common/schemas/*.py" = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [".agents/sync_agents.py", ".github/scripts/ci_gate.py", "common", "registry", "orchestrator", "tests"]
mypy_path = ".agents:.github/scripts:."
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Integration tests need the local stack (make up); run them with make smoke.
addopts = "-ra -m 'not integration'"
markers = ["integration: needs the local stack from infra/docker-compose.yml (make smoke)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]
