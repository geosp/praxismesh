[project]
name = "praxismesh"
version = "0.0.0"
description = "Durable orchestration for autonomous AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".agents/skills", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [".agents/sync_agents.py", ".github/scripts/ci_gate.py", "tests"]
mypy_path = ".agents:.github/scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]
