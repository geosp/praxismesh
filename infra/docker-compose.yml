# PraxisMesh local platform stack (Phase 0). Run it through the Makefile, which
# passes --env-file infra/.env; see infra/.env.example for every variable.
# Design: docs/rfcs/phase-0-local-infrastructure.md. Database: docs/adr/0002.
#
# Images are pinned by tag and digest; Dependabot proposes updates. Host ports
# bind to 127.0.0.1 only. The model endpoint (vLLM) is external, configured by
# VLLM_BASE_URL; there is no vLLM service here (Phase 0 deviation, decision log).
# The project name is COMPOSE_PROJECT_NAME in infra/.env; the Makefile passes it
# with -p and ignores any value in the shell.

services:
  db:
    # ParadeDB is AGPL-3.0, run unmodified as a separate service (docs/release.md).
    image: paradedb/paradedb:0.26.6-pg16@sha256:c0f24b2e8d0bbb989006992b30956d904b2e121e5060452fb8da46e6fc79c5b4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: postgres
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in infra/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in infra/.env}
      # ParadeDB otherwise sizes shared_buffers to 25% of host RAM; keep the
      # stack inside its memory budget (RFC, Risks).
      PDB_TUNE: "false"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/20_praxismesh.sh:ro
      - ./db/healthcheck.sh:/usr/local/bin/praxismesh-healthcheck:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/praxismesh-healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  temporal-schema:
    image: temporalio/admin-tools:1.32.2@sha256:4a95866efba29d7e17ab012df5232795e8b0ad0f7d5f9d1ec4df321f7792a754
    entrypoint: ["sh", "/etc/praxismesh/schema.sh"]
    environment:
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in infra/.env}
    volumes:
      - ./temporal/schema.sh:/etc/praxismesh/schema.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  temporal:
    image: temporalio/server:1.32.2@sha256:7bf69188a6232fea14869b9cef3d94aa82a1601d99517f7e86c71f22da4e0670
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: db
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in infra/.env}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/docker.yaml
    volumes:
      - ./temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    # The server image has no `temporal` CLI; probe the frontend's HTTP API.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7243/api/v1/cluster-info"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    restart: unless-stopped

  temporal-namespace:
    image: temporalio/admin-tools:1.32.2@sha256:4a95866efba29d7e17ab012df5232795e8b0ad0f7d5f9d1ec4df321f7792a754
    entrypoint: ["sh", "/etc/praxismesh/namespace.sh"]
    environment:
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_RETENTION: ${TEMPORAL_RETENTION:-72h}
    volumes:
      - ./temporal/namespace.sh:/etc/praxismesh/namespace.sh:ro
    depends_on:
      temporal:
        condition: service_healthy
    restart: "no"

  temporal-ui:
    image: temporalio/ui:2.58.1@sha256:ac3c13eddb4547d830991bb5eee93a5d97140134522b7297fdb2be1fe25ef925
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 5s
      retries: 40
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-ip.bind=0.0.0.0", "-master.volumeSizeLimitMB=256"]
    environment:
      # Fallback admin credentials, used because no S3 config file is given.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in infra/.env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in infra/.env}
    volumes:
      - seaweeddata:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
    restart: unless-stopped

  # Phase 1 workers (profile `workers`): `make workers-up`. The image is built
  # locally from workers/Dockerfile and never published. Each worker's scratch
  # space is a private tmpfs: recovery never relies on a worker's local files.
  orchestrator:
    profiles: [workers]
    image: praxismesh-worker:dev
    build:
      context: ..
      dockerfile: workers/Dockerfile
    command: ["orchestrator"]
    environment: &worker-env
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      DB_HOST: db
      DB_PORT: "5432"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in infra/.env}
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in infra/.env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in infra/.env}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in infra/.env}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      PRAXIS_SAMPLE_DB_URL: postgresql+asyncpg://praxismesh:${APP_DB_PASSWORD}@db:5432/praxismesh
      # Set OTEL_EXPORTER_OTLP_ENDPOINT in infra/.env (any value) to send worker
      # traces to the Jaeger service of the observability profile.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:+http://jaeger:4318}
      METRICS_PORT: "9100"
      LOG_LEVEL: INFO
    healthcheck: &worker-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics')"]
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on: &worker-deps
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
      s3:
        condition: service_healthy
    restart: unless-stopped

  worker-a:
    profiles: [workers]
    image: praxismesh-worker:dev
    command: ["template", "local-default"]
    environment: *worker-env
    tmpfs:
      - /scratch:uid=10001,gid=10001
    healthcheck: *worker-health
    depends_on: *worker-deps
    restart: unless-stopped

  worker-b:
    profiles: [workers]
    image: praxismesh-worker:dev
    command: ["template", "local-default"]
    environment: *worker-env
    tmpfs:
      - /scratch:uid=10001,gid=10001
    healthcheck: *worker-health
    depends_on: *worker-deps
    restart: unless-stopped

  # Deterministic fake model for CI (profile `fake-model`); workers reach it with
  # VLLM_BASE_URL=http://fake-model:8765.
  fake-model:
    profiles: [fake-model]
    image: praxismesh-worker:dev
    entrypoint: ["python", "-m", "tests.support.fake_model"]
    command: ["--script", "/app/tests/support/fake_model/order_script.json", "--port", "8765"]

  # Optional observability (profile `observability`): `make observability-up`.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    restart: unless-stopped

volumes:
  pgdata:
  seaweeddata:
